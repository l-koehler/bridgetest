[package]
name = "bridgetest"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
azalea          = { git = "https://github.com/azalea-rs/azalea" }
azalea-client   = { git = "https://github.com/azalea-rs/azalea" }
azalea-block    = { git = "https://github.com/azalea-rs/azalea" }
azalea-language = { git = "https://github.com/azalea-rs/azalea" }

luanti-protocol = { git = "https://github.com/kawogi/luanti-rs.git" }
luanti-core     = { git = "https://github.com/kawogi/luanti-rs.git" }

base64 = "^0.22.1"
chrono = "^0.4.42"
config = "^0.15.18"
dirs = "^6.0.0"
reqwest = { version = "^0.12.24", features = ["blocking", "json"] }
sha1 = "^0.10.6"
glam = "^0.30.9"
tokio = "^1.48.0"
zip-extract = "0.1.3"
rand = "0.8.5"
tokio-stream = "^0.1.17"
bimap = "^0.6.3"
minecraft-data-rs = "^0.8.1"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.145"
log = "^0.4.28"
env_logger = "^0.11.8"
clap = "^4.5.51"

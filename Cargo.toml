[package]
name = "bridgetest"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# azalea is pretty unstable, update manually from time to time
azalea = { git = "https://github.com/azalea-rs/azalea.git", rev = "615df92" }
azalea-language = { git = "https://github.com/azalea-rs/azalea.git", rev = "615df92" }

luanti-protocol = { git = "https://github.com/l-koehler/luanti-rs", branch = "update-52" }
luanti-core     = { git = "https://github.com/l-koehler/luanti-rs", branch = "update-52" }
# Has to match with whatever luanti-* uses
glam = "0.32"

chrono = "^0.4.42"
config = "^0.15.18"
dirs = "^6.0.0"
reqwest = { version = "^0.12.24", features = ["blocking", "json"] }
sha1 = "^0.10.6"
tokio = "^1.48.0"
rand = "0.8.5"
tokio-stream = "^0.1.17"
bimap = "^0.6.3"
minecraft-data-rs = "^0.8.1"
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.145"
log = "^0.4.28"
env_logger = "^0.11.8"
clap = "^4.5.51"
# default includes aes-crypto and time
zip = { version = "^6.0.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "ppmd", "xz", "zstd"] }
